{% extends "base.html" %}
{% block content %}
    <h1> вход</h1>
    <form action="" method="post" novalidate>
        {{ form.hidden_tag() }}
        <p>
            {{ form.name_user.label }} <br>
            {{ form.name_user(size=32) }} 
        </p>
        <p>
            {{ form.password.label }} <br>
            {{ form.password(size=32) }} 
        </p>
        <p>{{ form.remember() }} {{ form.remember.label }}</p>
        <p>{{ form.submit() }}</p>
    </form>    
{% endblock %}
